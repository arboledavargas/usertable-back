enum FieldType {
    TEXT
    NUMBER
    DATE
    BOOLEAN
}

enum OrderDirection {
    ASC
    DESC
}

enum PaginationDirection {
    Forward
    Backward
}

input CustomerOrder {
    field: String! # Field to order by (could be a property field name)
    direction: OrderDirection!
}

type Organization {
    id: String!
    name: String!
}

type CustomerFormField {
    id: String!
    fieldName: String!
    type: FieldType!
}

type CustomerProperty {
    name: String!
    value: String!
}

type Customer {
    id: String!
    properties: [CustomerProperty!]!
}

type User {
    id: String!
    name: String!
    email: String!
    organization: Organization!
}

type CustomerEdge {
    node: Customer!
    cursor: String!
}

type CustomerConnection {
    edges: [CustomerEdge!]!
}

input CustomerPropertyInput {
    name: String!
    value: String!
}

input FormFieldValueInput {
    customerFormFieldId: String!
    value: String!
}

input CustomerInput {
    properties: [FormFieldValueInput!]!
}

input UpdateCustomerInput {
    properties: [CustomerPropertyInput!]!
}

input Filter {
    fieldName: String!
    value: String!
}

input CustomerFormFieldInput {
    fieldName: String!
    type: FieldType!
}

input OrganizationInput {
    name: String!
    userMail: String!
    userName: String!
}

type UpdateCustomerPayload {
    customer: Customer
    success: Boolean!
    message: String
}

type CreateCustomerFormFieldPayload {
    customerFormField: CustomerFormField
    success: Boolean!
    message: String
}

type CreateOrganizationPayload {
    organization: Organization
    success: Boolean!
    message: String
}

type DeleteCustomerPayload {
    success: Boolean!
    message: String
}

type CreateCustomerPayload {
    customer: Customer
    success: Boolean!
    message: String
}

type Query {
    filterCustomers(
        filters: [Filter!]!
        take: Int
        cursor: String
        direction: PaginationDirection
        orderBy: CustomerOrder
        searchText: String
    ): CustomerConnection!
    getCustomerById(id: String!): Customer!
    getCustomerFormFields: [CustomerFormField!]!
    user: User
}

type Mutation {
    createCustomerFormField(
        input: CustomerFormFieldInput!
    ): CreateCustomerFormFieldPayload!

    deleteCustomers(userIds: [String!]!): DeleteCustomerPayload!

    createOrganization(input: OrganizationInput!): CreateOrganizationPayload!

    createCustomer(input: CustomerInput!): CreateCustomerPayload!

    updateCustomer(
        id: String!
        input: UpdateCustomerInput!
    ): UpdateCustomerPayload!
}

schema {
    query: Query
    mutation: Mutation
}
